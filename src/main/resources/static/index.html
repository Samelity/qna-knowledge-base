<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库问答</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#f0f2f5;color:#1f1f1f;height:100vh;display:flex;flex-direction:column}
        header{background:#1677ff;color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
        header h1{font-size:18px;font-weight:600}
        .status{display:flex;align-items:center;gap:6px;font-size:13px}
        .dot{width:8px;height:8px;border-radius:50%;background:#52c41a}
        .dot.off{background:#ff4d4f}
        main{display:flex;flex:1;overflow:hidden}
        .panel-left{width:340px;min-width:280px;background:#fff;border-right:1px solid #e8e8e8;display:flex;flex-direction:column}
        .panel-left .hd{padding:14px 16px 10px;border-bottom:1px solid #f0f0f0;font-weight:600;font-size:15px}
        .upload-area{margin:12px;border:2px dashed #d9d9d9;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:.2s}
        .upload-area:hover,.upload-area.over{border-color:#1677ff;background:#e6f4ff}
        .upload-area p{font-size:13px;color:#8c8c8c}
        .upload-area input{display:none}
        .progress{height:4px;background:#f0f0f0;border-radius:2px;margin:8px 12px;overflow:hidden;display:none}
        .progress .bar{height:100%;background:#1677ff;width:0;transition:width .2s}
        .doc-list{flex:1;overflow-y:auto;padding:0 12px 12px}
        .doc-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid #f0f0f0;border-radius:6px;margin-bottom:8px;font-size:13px}
        .doc-item .info{flex:1;overflow:hidden}
        .doc-item .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .doc-item .meta{color:#8c8c8c;font-size:12px;margin-top:2px}
        .doc-item .del{background:none;border:none;color:#ff4d4f;cursor:pointer;font-size:18px;padding:0 4px;flex-shrink:0}
        .panel-right{flex:1;display:flex;flex-direction:column;background:#f5f5f5}
        .chat-box{flex:1;overflow-y:auto;padding:16px 24px}
        .msg{margin-bottom:16px;display:flex}
        .msg.user{justify-content:flex-end}
        .msg .bubble{max-width:75%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;word-break:break-word}
        .msg.ai .bubble{background:#fff;border:1px solid #e8e8e8}
        .msg.user .bubble{background:#1677ff;color:#fff}
        .sources{margin-top:6px;font-size:12px;color:#8c8c8c}
        .sources span{display:inline-block;background:#f0f0f0;padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0}
        .sources span.bad{background:#fff2f0;color:#cf1322}
        .input-bar{padding:12px 24px;background:#fff;border-top:1px solid #e8e8e8;display:flex;gap:8px}
        .input-bar input{flex:1;border:1px solid #d9d9d9;border-radius:6px;padding:8px 12px;font-size:14px;outline:none}
        .input-bar input:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
        .input-bar button{background:#1677ff;color:#fff;border:none;border-radius:6px;padding:8px 20px;cursor:pointer;font-size:14px}
        .input-bar button:disabled{background:#d9d9d9;cursor:not-allowed}
        .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:999;display:none}
    </style>
</head>
<body>
<header>
    <h1>知识库问答</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">检测中…</span></div>
</header>
<main>
    <div class="panel-left">
        <div class="hd">文档管理</div>
        <div class="upload-area" id="dropZone">
            <p>拖拽文件到此处，或点击选择</p>
            <p style="font-size:12px;color:#bfbfbf;margin-top:4px">支持 pdf / docx / xlsx / xls / pptx / ppt / txt / md</p>
            <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.xls,.pptx,.ppt,.txt,.md" multiple>
        </div>
        <div class="progress" id="prog">
            <div class="bar" id="progBar"></div>
        </div>
        <div class="doc-list" id="docList"><p style="text-align:center;color:#bfbfbf;margin-top:20px;font-size:13px">
            暂无文档</p></div>
    </div>
    <div class="panel-right">
        <div class="chat-box" id="chatBox"></div>
        <div class="input-bar">
            <input id="qInput" placeholder="输入问题，回车发送…" autocomplete="off">
            <button id="sendBtn">发送</button>
        </div>
    </div>
</main>
<div class="toast" id="toast"></div>

<script>
    // ========== 配置区：后端地址 ==========
    const API = "http://localhost:8080";
    // ============================================

    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}

    // 健康检测
    fetch(API+'/api/documents').then(r=>{
      if(r.ok){document.getElementById('dot').className='dot';document.getElementById('statusTxt').textContent='已连接'}
      else throw 0
    }).catch(()=>{
      document.getElementById('dot').className='dot off';document.getElementById('statusTxt').textContent='后端未连通'
    });

    // 上传
    const drop=document.getElementById('dropZone'),fi=document.getElementById('fileInput');
    drop.onclick=()=>fi.click();
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
    drop.ondragleave=()=>drop.classList.remove('over');
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files.length)upload(e.dataTransfer.files[0])};
    fi.onchange=()=>{if(fi.files.length)upload(fi.files[0])};

    function upload(file){
      const ext=file.name.split('.').pop().toLowerCase();
      if(!['pdf','docx','xlsx','xls','pptx','ppt','txt','md'].includes(ext)){toast('不支持的文件类型');return}
      const fd=new FormData();fd.append('file',file);
      const xhr=new XMLHttpRequest();
      const prog=document.getElementById('prog'),bar=document.getElementById('progBar');
      prog.style.display='block';bar.style.width='0%';
      xhr.upload.onprogress=e=>{if(e.lengthComputable)bar.style.width=Math.round(e.loaded/e.total*100)+'%'};
      xhr.onload=()=>{
        prog.style.display='none';
        try{const r=JSON.parse(xhr.responseText);if(r.success||r.docId){toast('上传成功');loadDocs()}else toast(r.message||'上传失败')}
        catch(e){toast('上传失败')}
      };
      xhr.onerror=()=>{prog.style.display='none';toast('网络错误')};
      xhr.open('POST',API+'/api/documents/upload');xhr.send(fd);
    }

    // 文档列表
    function loadDocs(){
      fetch(API+'/api/documents').then(r=>r.json()).then(list=>{
        const el=document.getElementById('docList');
        if(!list||!list.length){el.innerHTML='<p style="text-align:center;color:#bfbfbf;margin-top:20px;font-size:13px">暂无文档</p>';return}
        el.innerHTML=list.map(d=>`<div class="doc-item"><div class="info"><div class="name">${esc(d.fileName||d.displayName||'')}</div><div class="meta">${esc(d.fileType||'')} · ${d.chunkCount||0} 切片 · ${fmtDate(d.createdAt)}</div></div><button class="del" data-id="${d.id}" title="删除">✕</button></div>`).join('');
        el.querySelectorAll('.del').forEach(b=>b.onclick=()=>delDoc(b.dataset.id));
      }).catch(()=>{});
    }
    function fmtDate(s){if(!s)return'';try{return new Date(s).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return s}}

    function delDoc(id){
      if(!confirm('确定删除该文档？'))return;
      fetch(API+'/api/documents/'+id,{method:'DELETE'}).then(r=>r.json()).then(r=>{
        if(r.success||r.ok){toast('已删除');loadDocs()}else toast(r.message||'删除失败')
      }).catch(()=>toast('删除失败'));
    }

    // 问答
    const chatBox=document.getElementById('chatBox'),qInput=document.getElementById('qInput'),sendBtn=document.getElementById('sendBtn');
    function append(role,text,sources,duration){
      const div=document.createElement('div');div.className='msg '+role;
      let srcHtml='';
      if(sources&&sources.length){
        srcHtml='<div class="sources">参考资料：'+sources.map(s=>{
          const m=String(s).match(/score=([\d.]+)/);const sc=m?parseFloat(m[1]):0;
          const cls=sc<0.7?'bad':'';return `<span class="${cls}">${esc(String(s))}</span>`
        }).join('')+'</div>'
      }
      const durHtml=duration!=null?`<div style="font-size:12px;color:#bfbfbf;margin-top:4px">耗时 ${duration}ms</div>`:'';
      div.innerHTML=`<div class="bubble">${esc(text)}${srcHtml}${durHtml}</div>`;
      chatBox.appendChild(div);chatBox.scrollTop=chatBox.scrollHeight;
    }

    function send(){
      const q=qInput.value.trim();if(!q)return;
      qInput.value='';sendBtn.disabled=true;
      append('user',q);
      const t0=Date.now();
      fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})
      .then(r=>r.json()).then(r=>{
        const dur=Date.now()-t0;
        append('ai',r.answer||'未返回内容',r.sources,dur);
      }).catch(()=>{append('ai','请求失败，请检查后端');sendBtn.disabled=false})
      .finally(()=>sendBtn.disabled=false);
    }
    sendBtn.onclick=send;
    qInput.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};

    loadDocs();
</script>
</body>
</html>
